[project]
name = "job-intel-agent"
version = "0.2.0"
description = "Evidence-backed job intelligence with persistent history and public trial quotas"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.99",
    "anthropic>=0.60",
    "langgraph>=1.0",
    "pydantic>=2.10",
    "pdfplumber>=0.11.9",
    "python-dotenv>=1.0",
    "ddgs>=9.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "streamlit[auth]>=1.42",
    "rich>=13.0",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.2,<4",
    "pyyaml>=6,<7",
]
[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.11"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["job_intel"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
target-version = "py312"
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
