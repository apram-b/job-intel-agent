AWSTemplateFormatVersion: '2010-09-09'
Description: Job Intel private worker (deploy in ap-south-1; verify bundle is USD12 before creation)
Parameters:
  OwnerCidr:
    Type: String
    Description: Owner's current public IPv4 address with /32 suffix
    AllowedPattern: '^([0-9]{1,3}\.){3}[0-9]{1,3}/32$'
  BundleId:
    Type: String
    Default: small_3_0
    AllowedValues: [small_3_0]
  BlueprintId:
    Type: String
    Default: ubuntu_24_04
  DemoBucketArn:
    Type: String
    Description: ARN from the separate edge stack
Resources:
  Worker:
    Type: AWS::Lightsail::Instance
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      InstanceName: job-intel-worker
      BlueprintId: !Ref BlueprintId
      BundleId: !Ref BundleId
      AvailabilityZone: ap-south-1a
      Networking:
        Ports:
          - FromPort: 22
            ToPort: 22
            Protocol: tcp
            Cidrs: [!Ref OwnerCidr]
      Tags: [{Key: Project, Value: job-intel}]
      UserData: |
        #!/bin/bash
        set -euo pipefail
        apt-get update
        apt-get install -y docker.io docker-compose-v2 age unzip curl unattended-upgrades
        systemctl enable --now docker
        mkdir -p /opt/job-intel/releases /opt/job-intel/shared
        chown 10001:10001 /opt/job-intel/shared
        chmod 700 /opt/job-intel/shared
        curl --fail --silent --show-error https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip -o /tmp/awscliv2.zip
        unzip -q /tmp/awscliv2.zip -d /tmp/job-intel-awscli
        /tmp/job-intel-awscli/aws/install
  StaticIp:
    Type: AWS::Lightsail::StaticIp
    Properties:
      StaticIpName: job-intel-worker-ip
      AttachedTo: !Ref Worker
  BackupBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      LifecycleConfiguration:
        Rules:
          - Id: SevenDays
            Status: Enabled
            Prefix: daily/
            ExpirationInDays: 7
            AbortIncompleteMultipartUpload: {DaysAfterInitiation: 1}
  Alerts:
    Type: AWS::SNS::Topic
    Properties: {DisplayName: Job Intel operational alerts}
  WorkerIdentity:
    Type: AWS::IAM::User
    Properties:
      Policies:
        - PolicyName: job-intel-artifacts-only
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource:
                  - !Sub '${BackupBucket.Arn}/daily/*'
                  - !Sub '${DemoBucketArn}/index.html'
                  - !Sub '${DemoBucketArn}/data.json'
                  - !Sub '${DemoBucketArn}/health.json'
              - Effect: Allow
                Action: sns:Publish
                Resource: !Ref Alerts
Outputs:
  Address: {Value: !GetAtt StaticIp.IpAddress}
  BackupBucket: {Value: !Ref BackupBucket}
  AlertTopic: {Value: !Ref Alerts}
  ScopedWorkerUser: {Value: !Ref WorkerIdentity}
